# .github/workflows/deploy-docs.yml
name: 🚀 Deploy docs/ to GitHub Pages

on:
  push:
    branches:
      - docs        # triggers when you push to the docs branch
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout docs branch
        uses: actions/checkout@v4
        with:
          ref: docs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./        # deploy from root of docs branch
          publish_branch: gh-pages   # branch that GitHub Pages serves from
          enable_jekyll: false       # ensures .nojekyll is added :contentReference[oaicite:1]{index=1}
          keep_files: false

      - name: Confirm deployment
        run: echo "Deployed docs/ → gh-pages"
